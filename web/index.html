<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>DominoParty</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="lobby">
      <div class="lobby-card">
        <h1>🁣 DominoParty</h1>
        <input id="player-name" type="text" placeholder="Your name" maxlength="20" autocomplete="off" />
        <input id="room-code" type="text" placeholder="Room code" maxlength="30" autocomplete="off" />
        <button id="join-btn">Join room</button>
      </div>
    </div>
    <div id="game" hidden>
      <div id="toolbar">
        <span id="room-label"></span>
        <span id="players"></span>
        <button id="menu-btn" aria-label="Menu">☰</button>
      </div>
      <div id="menu" hidden>
        <button data-setup="9">Setup double-9</button>
        <button data-setup="12">Setup double-12</button>
        <button data-setup="15">Setup double-15</button>
        <button id="shuffle-btn">Shuffle</button>
        <button id="arrange-btn">Arrange hand</button>
        <button id="share-btn">Share link</button>
      </div>
      <div id="stage">
        <div id="zoom-controls">
          <button id="zoom-in" aria-label="Zoom in">＋</button>
          <button id="zoom-out" aria-label="Zoom out">－</button>
        </div>
        <div id="toast" hidden></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
